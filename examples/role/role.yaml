apiVersion: ldap.kubed.io/v1alpha1
kind: Role
metadata:
  name: kubed-test-role
spec:
  baseDn: ou=roles,dc=burbs
  description: Kubed test realm role (explicit member + selected service accounts)
  owner: uid=kelly,ou=users,dc=burbs
  members:                              # explicit DNs (humans)
  - uid=kelly,ou=users,dc=burbs
  # service accounts opt in by carrying the label below; each match's status.dn is
  # unioned into the authoritative member list:
  serviceAccountSelector:
    matchLabels:
      ldap.kubed.io/role.kubed-test-role: "true"
