apiVersion: ldap.kubed.io/v1alpha1
kind: ServiceAccount
metadata:
  name: kubed-test-sa
  labels:
    # opt this SA into the kubed-test-role (the Role's serviceAccountSelector matches this)
    ldap.kubed.io/role.kubed-test-role: "true"
spec:
  baseDn: ou=services,dc=burbs
  mail: kubed-test-sa@example.com   # fake domain on purpose, so mailserver ignores it
  posix:
    uidNumber: "9001"
    gidNumber: "2001"          # the existing services posix group
  connectionSecret:
    namespace: crossplane
    name: kubed-test-sa-ldap-creds   # keys: username, password
