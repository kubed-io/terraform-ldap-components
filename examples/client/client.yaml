apiVersion: ldap.kubed.io/v1alpha1
kind: Client
metadata:
  name: nextcloud
spec:
  baseDn: ou=clients,dc=example
  owner: uid=nextcloud,ou=services,dc=example   # the SA that runs the app; also seed member
  description: Nextcloud login surface
  url: https://nextcloud.example.com
  roles:                                         # each → cn=<name>,cn=nextcloud,ou=clients
  - name: admin
    description: Nextcloud administrators
  - name: media-manager
