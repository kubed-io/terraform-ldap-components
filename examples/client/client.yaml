apiVersion: ldap.kubed.io/v1alpha1
kind: Client
metadata:
  name: kubed-test-client
spec:
  baseDn: ou=clients,dc=burbs
  owner: uid=kubed-test-sa,ou=services,dc=burbs   # the SA that runs the app; also seed member
  description: Kubed test app login surface
  url: https://kubed-test.example.com
  roles:                                           # each → cn=<name>,cn=kubed-test-client,ou=clients
  - name: admin
    description: Kubed test administrators
  - name: viewer
