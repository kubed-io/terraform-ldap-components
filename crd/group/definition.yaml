apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: groups.ldap.kubed.io
  labels:
    ldap.kubed.io/has-mail: "true"
    ldap.kubed.io/patch-and-transform: "true"
spec:
  scope: Cluster
  group: ldap.kubed.io
  names:
    kind: Group
    plural: groups
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - baseDn
            - gidNumber
            properties:
              # baseDn + description injected by the shared component
              # mail injected by the shared component (has-mail)
              gidNumber:
                type: string
                description: POSIX gidNumber; globally unique.
              members:
                type: array
                default: []
                description: Curated bare uids (memberUid). CRD-authoritative.
                items:
                  type: string
          status:
            type: object
            description: Observed state.
            properties:
              dn:
                type: string
                description: The full DN of the created group.
              share:
                type: object
                description: Freeform module outputs.
                x-kubernetes-preserve-unknown-fields: true
