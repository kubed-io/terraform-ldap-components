apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: groups.ldap.kubed.io
  labels:
    ldap.kubed.io/has-mail: "true"
    ldap.kubed.io/patch-and-transform: "true"
spec:
  scope: Cluster
  group: ldap.kubed.io
  names:
    kind: Group
    plural: groups
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - baseDn
            - gidNumber
            properties:
              # baseDn + description injected by the shared component
              # mail injected by the shared component (has-mail)
              gidNumber:
                type: string
                description: POSIX gidNumber; globally unique.
              members:
                type: array
                default: []
                description: |
                  Curated bare uids (memberUid). Merged (not authoritative) with the
                  serviceAccountSelector-resolved uids and the live memberUid — see the
                  module's `members` var.
                items:
                  type: string
              serviceAccountSelector:
                type: object
                description: |
                  Selects ServiceAccount CRs (by label) whose bare uid (status.share.username)
                  is added to this group's memberUid. Flat: every match joins the group (no
                  roles — posix groups are flat). The selector-resolved uids are merged with
                  the curated `members` and the live memberUid, so declarative selection and
                  ad-hoc grants coexist.
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                    description: Label key/values an eligible ServiceAccount must carry.
          status:
            type: object
            description: Observed state.
            properties:
              dn:
                type: string
                description: The full DN of the created group.
              share:
                type: object
                description: Freeform module outputs.
                x-kubernetes-preserve-unknown-fields: true
              # Staging field written by the selector (go-templating) step and read back by
              # patch-and-transform into the module varmap. MUST be declared — the typed
              # status patch is rejected for undeclared fields.
              selectedMembers:
                type: array
                description: Bare uids resolved from serviceAccountSelector (status.share.username of each match).
                items:
                  type: string
