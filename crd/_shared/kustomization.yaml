apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Shared, label-driven injection of the pieces common to the LDAP IAM CRDs.
#
# Each concept below is its own transformer file with its own target selector.
# A kind opts in by putting the matching label on BOTH its definition and its
# composition; unlabeled transformers (common.yaml schema) apply everywhere.
#
# common.yaml + server-ref.yaml inject universal schema (baseDn, description, serverRef)
# onto every XRD with no label needed.
#
# Labels (all under ldap.kubed.io/):
#   has-mail            → mail schema + varmap patch          (service-account, group)
#   groupofnames        → owner + seeAlso/category/org/orgUnit (team, role, client)
#   patch-and-transform → workspace scaffold + common varmap + serverRef→providerConfigRef
#                         (the 4 non-role kinds; role wires these itself in its template)
transformers:
- common.yaml
- server-ref.yaml
- mail.yaml
- groupofnames.yaml
- scaffold.yaml
