apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clients.ldap.kubed.io
  labels:
    ldap.kubed.io/groupofnames: "true"
    ldap.kubed.io/patch-and-transform: "true"
spec:
  scope: Cluster
  group: ldap.kubed.io
  names:
    kind: Client
    plural: clients
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - baseDn
            properties:
              # baseDn + description injected by the shared component
              # owner + seeAlso/category/org/orgUnit injected by the shared component (groupofnames).
              # owner is NOT required here: it may instead come from a selected ServiceAccount
              # carrying client.keycloak.kubed.io/<client-name>/owner: "true". An explicit
              # spec.owner takes precedence; otherwise the first such selected SA is the owner.
              url:
                type: string
                nullable: true
                description: App URL stored as labeledURI on the client root.
              roles:
                type: array
                default: []
                description: Client roles; each becomes a child groupOfNames under the client.
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    default:
                      type: boolean
                      default: false
                      description: |
                        When true, selected service accounts whose role annotation is absent
                        join this role. At most one role should set this; if none does, the
                        first role is the default.
              serviceAccountSelector:
                type: object
                description: |
                  Selects ServiceAccount CRs (by label) whose principals are placed into this
                  client's role children. Each selected SA joins the role named in its
                  client.keycloak.kubed.io/<client-name>/role annotation (absent -> the default
                  role). One selected SA may also carry
                  client.keycloak.kubed.io/<client-name>/owner: "true" to become the client
                  owner (unless spec.owner is set explicitly). Membership is merged with the
                  owner seed and any externally-added members, so declarative and ad-hoc
                  (SASL/n8n) grants coexist.
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                    description: Label key/values an eligible ServiceAccount must carry.
          status:
            type: object
            description: Observed state.
            properties:
              dn:
                type: string
                description: The full DN of the created client root.
              share:
                type: object
                description: Freeform module outputs (includes role_dns).
                x-kubernetes-preserve-unknown-fields: true
              # Staging fields written by the selector (go-templating) step and read back by
              # patch-and-transform into the module varmap. MUST be declared — the typed status
              # patch is rejected for undeclared fields.
              selectedMembers:
                type: array
                description: ServiceAccount members resolved from serviceAccountSelector ({dn, role}).
                items:
                  type: object
                  properties:
                    dn:
                      type: string
                    role:
                      type: string
                      nullable: true
              selectedOwner:
                type: string
                description: Resolved owner DN (explicit spec.owner, else an annotation-selected SA).
