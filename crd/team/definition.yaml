apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: teams.ldap.kubed.io
  labels:
    ldap.kubed.io/groupofnames: "true"
    ldap.kubed.io/patch-and-transform: "true"
spec:
  scope: Cluster
  group: ldap.kubed.io
  names:
    kind: Team
    plural: teams
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - baseDn
            - owner
            # all spec properties come from the shared component:
            #   baseDn + description (common); owner + seeAlso/category/org/orgUnit (groupofnames)
            properties: {}
          status:
            type: object
            description: Observed state.
            properties:
              dn:
                type: string
                description: The full DN of the created team.
              share:
                type: object
                description: Freeform module outputs.
                x-kubernetes-preserve-unknown-fields: true
