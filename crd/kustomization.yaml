apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: ldap-crds
# All five LDAP IAM CRDs. Each kind pulls common schema + wiring from ../_shared
# (a label-driven kustomize Component); this file just composes the kinds together.
resources:
- service-account
- group
- team
- role
- client
